<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Higher or Lower - Bonenko Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center, #16161c 0%, #08080c 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    .home-btn {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(25, 25, 32, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      z-index: 300;
    }

    .home-btn:hover {
      background: rgba(40, 40, 50, 0.95);
      border-color: rgba(255, 42, 133, 0.5);
      transform: translateY(-2px);
    }

    .container {
      width: 100%;
      max-width: 1100px;
      padding: 2.5rem;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ff2a85 0%, #00d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 42, 133, 0.3);
    }

    p.subtitle {
      color: #9494a0;
      font-size: 1.15rem;
      margin-bottom: 2.5rem;
    }

    .score-banner {
      display: inline-block;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 30px;
      border-radius: 14px;
      font-size: 1.15rem;
      margin-bottom: 2.5rem;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
    }

    .score-banner span {
      color: #1db954;
      font-weight: 900;
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 30px;
      align-items: center;
    }

    .card {
      background: rgba(22, 22, 28, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
      position: relative;
      height: 520px;
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #101014;
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .anime-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .anime-stat {
      font-size: 1.5rem;
      font-weight: 900;
      color: #1db954;
    }

    .vs-badge {
      background: linear-gradient(135deg, #ff2a85, #00d2ff);
      color: #000;
      font-weight: 900;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 0 25px rgba(255, 42, 133, 0.5);
      z-index: 10;
    }

    .choice-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-choice {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-choice:hover {
      background: #1db954;
      color: #000;
      border-color: #1db954;
      transform: translateY(-2px);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
    }

    .modal-card {
      background: rgba(22, 22, 28, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3rem;
      border-radius: 24px;
      text-align: center;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-card h2 {
      font-size: 2.4rem;
      color: #ff2a85;
      margin-bottom: 0.5rem;
    }

    .modal-card p {
      color: #aaa;
      font-size: 1.15rem;
      margin-bottom: 1.5rem;
    }

    .final-score-display {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 2rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 12px;
    }

    .final-score-display span {
      color: #1db954;
    }

    .btn-restart {
      background: linear-gradient(135deg, #ff2a85 0%, #00d2ff 100%);
      color: #000;
      border: none;
      padding: 16px 30px;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-restart:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    @media (max-width: 900px) {
      .arena {
        grid-template-columns: 1fr;
      }
      .vs-badge {
        margin: 0 auto;
      }
      .card {
        height: 460px;
      }
    }
  </style>
</head>
<body>

  <a href="index.html" class="home-btn">🏠 Home</a>

  <div class="container">
    <h1>Anime Higher or Lower</h1>
    <p class="subtitle" id="subText">Loading 500 anime database (Page 1/20)...</p>

    <div class="score-banner">
      Current Score: <span id="currentScore">0</span> | Best Streak: <span id="bestScore">0</span>
    </div>

    <div class="arena" id="gameArena">
      <!-- Left Card (Anchor) -->
      <div class="card" id="leftCard">
        <img id="leftImg" src="" alt="Anime">
        <div class="card-content">
          <div class="anime-title" id="leftTitle">Loading...</div>
          <div class="anime-stat">Score: <span id="leftScoreVal">0.00</span></div>
        </div>
      </div>

      <div class="vs-badge">VS</div>

      <!-- Right Card (Active Choice Card) -->
      <div class="card" id="rightCard">
        <img id="rightImg" src="" alt="Anime">
        <div class="card-content">
          <div class="anime-title" id="rightTitle">Loading...</div>
          
          <div class="choice-buttons" id="choiceBox">
            <button class="btn-choice" onclick="makeGuess('higher')">📈 Higher</button>
            <button class="btn-choice" onclick="makeGuess('lower')">📉 Lower</button>
          </div>

          <div class="anime-stat" id="rightStat" style="display: none;">Score: <span id="rightScoreVal">0.00</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Modal Overlay -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-card">
      <h2>Game Over</h2>
      <p>Oops! Your guess was incorrect.</p>
      <div class="final-score-display">Final Score: <span id="finalScoreVal">0</span></div>
      <button class="btn-restart" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    let animePool = [];
    let usedAnimeTitles = new Set();
    let currentScore = 0;
    let bestScore = 0;
    let leftAnime = {};
    let rightAnime = {};

    async function fetchAnimePool() {
      try {
        let fetchedData = [];
        const totalPages = 20; // 20 pages * 25 items per page = 500 target anime

        for (let page = 1; page <= totalPages; page++) {
          document.getElementById('subText').innerText = `Loading anime database (${page}/${totalPages})...`;
          
          const res = await fetch(`https://api.jikan.moe/v4/top/anime?page=${page}`);
          const json = await res.json();
          
          if (json && json.data) {
            fetchedData = fetchedData.concat(json.data);
          }

          // Respect Jikan API rate limits with a small delay per request batch
          await new Promise(r => setTimeout(r, 350));
        }

        animePool = fetchedData
          .filter(item => item.score && item.images?.jpg?.large_image_url)
          .map(item => ({
            title: item.title_english || item.title,
            score: item.score,
            img: item.images.jpg.large_image_url
          }));

        // Deduplicate pool by title to ensure unique selection entries
        animePool = Array.from(new Set(animePool.map(a => a.title)))
          .map(title => animePool.find(a => a.title === title));

        if (animePool.length < 50) {
          throw new Error("Insufficient pool length");
        }

        document.getElementById('subText').innerText = "Does this anime have a higher or lower MyAnimeList score than the other?";
        initGame();
      } catch (error) {
        document.getElementById('subText').innerText = "Error loading anime database. Please refresh.";
      }
    }

    function getUniqueRandomAnime(excludeTitle = "") {
      let available = animePool.filter(a => a.title !== excludeTitle && !usedAnimeTitles.has(a.title));
      
      if (available.length === 0) {
        usedAnimeTitles.clear();
        available = animePool.filter(a => a.title !== excludeTitle);
      }

      let chosen = available[Math.floor(Math.random() * available.length)];
      usedAnimeTitles.add(chosen.title);
      return chosen;
    }

    function initGame() {
      if (animePool.length === 0) return;
      currentScore = 0;
      usedAnimeTitles.clear();
      document.getElementById('currentScore').innerText = currentScore;
      document.getElementById('gameOverModal').style.display = 'none';
      
      leftAnime = getUniqueRandomAnime();
      rightAnime = getUniqueRandomAnime(leftAnime.title);
      renderBoard();
    }

    function renderBoard() {
      document.getElementById('leftImg').src = leftAnime.img;
      document.getElementById('leftTitle').innerText = leftAnime.title;
      document.getElementById('leftScoreVal').innerText = leftAnime.score.toFixed(2);

      document.getElementById('rightImg').src = rightAnime.img;
      document.getElementById('rightTitle').innerText = rightAnime.title;
      
      document.getElementById('choiceBox').style.display = 'flex';
      document.getElementById('rightStat').style.display = 'none';
    }

    function makeGuess(choice) {
      const isHigher = rightAnime.score >= leftAnime.score;
      const userGuessedCorrectly = (choice === 'higher' && isHigher) || (choice === 'lower' && !isHigher);

      document.getElementById('choiceBox').style.display = 'none';
      document.getElementById('rightStat').style.display = 'block';
      document.getElementById('rightScoreVal').innerText = rightAnime.score.toFixed(2);

      setTimeout(() => {
        if (userGuessedCorrectly) {
          currentScore++;
          if (currentScore > bestScore) bestScore = currentScore;
          document.getElementById('currentScore').innerText = currentScore;
          document.getElementById('bestScore').innerText = bestScore;

          leftAnime = rightAnime;
          rightAnime = getUniqueRandomAnime(leftAnime.title);
          renderBoard();
        } else {
          document.getElementById('finalScoreVal').innerText = currentScore;
          document.getElementById('gameOverModal').style.display = 'flex';
        }
      }, 1600);
    }

    function restartGame() {
      initGame();
    }

    fetchAnimePool();
  </script>
</body>
</html>
