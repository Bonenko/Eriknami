  <div class="container">
    <h1>Anisong Symphony</h1>

    <div class="score-banner">
      Streak: <span id="currentScore">0</span> | Best: <span id="bestScore">0</span>
    </div>

    <div class="game-card">
      <div>
        <span class="track-type-badge" id="trackTypeBadge">Preparing Audio...</span>
      </div>
      
      <div class="audio-controls-wrapper">
        <div class="button-group">
          <button class="btn-play" id="playBtn" onclick="togglePlayPause()" disabled>⏳ Loading...</button>
          <button class="btn-skip" onclick="skipTrack()">⏭ Skip Track</button>
        </div>
        
        <div class="progress-section">
          <div class="progress-container" id="progressContainer" onclick="seekAudio(event)">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="time-info">
            <span id="currentTimeDisplay">0.0s</span>
            <span id="totalTimeDisplay">10.0s</span>
          </div>
        </div>

        <div class="volume-box">
          <span>🔊 Volume:</span>
          <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" id="volumeSlider" oninput="changeVolume(this.value)">
        </div>
      </div>

      <div class="search-container">
        <input type="text" id="animeInput" class="search-input" placeholder="Type anime title..." autocomplete="off" oninput="filterSuggestions()">
        <div class="suggestions-list" id="suggestionsBox"></div>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-card">
      <h2>Wrong Guess!</h2>
      <p id="correctAnswerReveal">The correct anime was: </p>
      <div style="font-size: 1.4rem; font-weight: 900; margin-bottom: 1.5rem; color: #f39c12;">Score: <span id="finalScoreVal">0</span></div>
      <button class="btn-restart" onclick="restartGame()">Try Again</button>
    </div>
  </div>

      { anime: "Konosuba", type: "Opening Theme (OP)", url: "https://animethemes.moe/video/KonoSubarashiiSekaiNiShukufukuWo-OP1.webm" },
      { anime: "DanMachi", type: "Opening Theme (OP)", url: "https://animethemes.moe/video/DungeonNiDeaiWoMotomeruNowaMachigatteiruDarouKa-OP1.webm" },
      { anime: "Fate Zero", type: "Opening Theme (OP)", url: "https://animethemes.moe/video/FateZero-OP1.webm" },
      { anime: "Fate Stay Night Unlimited Blade Works", type: "Opening Theme (OP)", url: "https://animethemes.moe/video/FateStayNightUnlimitedBladeWorks-OP1.webm" },
      { anime: "Log Horizon", type: "Opening Theme (OP)", url: "https://animethemes.moe/video/LogHorizon-OP1.webm" },
      { anime: "Hellsing Ultimate", type: "Opening Theme (OP)", url: "https://animethemes.moe/video/HellsingUltimate-ED1.webm" },
      { anime: "Drifters", type: "Opening Theme (OP)", url: "https://animethemes.moe/video/Drifters-OP1.webm" }
    ];

    let currentTarget = null;
    let currentScore = 0;
    let bestScore = 0;
    let audioTimer = null;
    let audioElement = document.getElementById('themeAudio');
    const clipDuration = 10.0;

    const allAnimeTitles = [...new Set(masterAnimeDatabase.map(item => item.anime))];

    function nextRound() {
      document.getElementById('statusMsg').innerText = "";
      document.getElementById('animeInput').value = "";
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('currentTimeDisplay').innerText = "0.0s";
      clearInterval(audioTimer);

      const playBtn = document.getElementById('playBtn');
      playBtn.innerText = "⏳ Loading Track...";
      playBtn.disabled = true;

      currentTarget = masterAnimeDatabase[Math.floor(Math.random() * masterAnimeDatabase.length)];
      document.getElementById('trackTypeBadge').innerText = currentTarget.type;

      audioElement.src = currentTarget.url;
      audioElement.load();
    }

    function skipTrack() {
      audioElement.pause();
      clearInterval(audioTimer);
      document.getElementById('statusMsg').style.color = "#f39c12";
      document.getElementById('statusMsg').innerText = `Skipped! It was: ${currentTarget.anime}`;
      setTimeout(() => {
        nextRound();
      }, 1200);
    }

    audioElement.oncanplaythrough = () => {
      const playBtn = document.getElementById('playBtn');
      playBtn.innerText = "▶ Play Audio Clip";
      playBtn.disabled = false;
    };

    audioElement.onerror = () => {
      nextRound(); 
    };

    function togglePlayPause() {
      const playBtn = document.getElementById('playBtn');

      if (!audioElement.paused) {
        // Pause state
        audioElement.pause();
        clearInterval(audioTimer);
        playBtn.innerText = "▶ Resume Clip";
      } else {
        // Play/Resume state
        if (audioElement.currentTime >= clipDuration || audioElement.currentTime >= audioElement.duration) {
          audioElement.currentTime = 0;
        }
        
        audioElement.play().then(() => {
          playBtn.innerText = "⏸ Pause Clip";
          startAudioTracker();
        }).catch(() => {
          playBtn.innerText = "▶ Play Audio Clip";
        });
      }
    }

    function startAudioTracker() {
      clearInterval(audioTimer);
      audioTimer = setInterval(() => {
        const current = audioElement.currentTime;
        const pct = Math.min((current / clipDuration) * 100, 100);
        
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('currentTimeDisplay').innerText = current.toFixed(1) + 's';

        if (current >= clipDuration) {
          audioElement.pause();
          clearInterval(audioTimer);
          document.getElementById('playBtn').innerText = "▶ Replay Clip";
        }
      }, 50);
    }

    function seekAudio(event) {
      if (audioElement.readyState < 2) return;
      
      const container = document.getElementById('progressContainer');
      const rect = container.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const clickRatio = Math.max(0, Math.min(1, clickX / width));
      
      const newTime = clickRatio * clipDuration;
      audioElement.currentTime = newTime;
      
      const pct = clickRatio * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('currentTimeDisplay').innerText = newTime.toFixed(1) + 's';

      if (!audioElement.paused) {
        startAudioTracker();
      }
    }

    function changeVolume(val) {
      audioElement.volume = parseFloat(val);
    }

    function filterSuggestions() {
      const query = document.getElementById('animeInput').value.toLowerCase().trim();
      const box = document.getElementById('suggestionsBox');
      box.innerHTML = "";

      if (!query) {
        box.style.display = 'none';
        return;
      }

      const matches = allAnimeTitles.filter(name => 
        name.toLowerCase().includes(query)
      ).slice(0, 6);

      if (matches.length > 0) {
        box.style.display = 'block';
        matches.forEach(title => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerText = title;
          div.onclick = () => submitGuess(title);
          box.appendChild(div);
        });
      } else {
        box.style.display = 'none';
      }
    }

    function submitGuess(guessedTitle) {
      audioElement.pause();
      clearInterval(audioTimer);
      document.getElementById('suggestionsBox').style.display = 'none';
      document.getElementById('animeInput').value = guessedTitle;

      const isCorrect = guessedTitle.toLowerCase() === currentTarget.anime.toLowerCase();

      if (isCorrect) {
        currentScore++;
        if (currentScore > bestScore) bestScore = currentScore;
        document.getElementById('currentScore').innerText = currentScore;
        document.getElementById('bestScore').innerText = bestScore;
        
        const msg = document.getElementById('statusMsg');
        msg.style.color = "#1db954";
        msg.innerText = "✨ Correct! Loading next song...";

        setTimeout(() => {
          nextRound();
        }, 1000);
      } else {
        document.getElementById('finalScoreVal').innerText = currentScore;
        document.getElementById('correctAnswerReveal').innerText = `The correct anime was: ${currentTarget.anime}`;
        document.getElementById('gameOverModal').style.display = 'flex';
      }
    }

    function restartGame() {
      currentScore = 0;
      document.getElementById('currentScore').innerText = currentScore;
      document.getElementById('gameOverModal').style.display = 'none';
      nextRound();
    }

    window.onclick = function(e) {
      if (!e.target.closest('.search-container')) {
        document.getElementById('suggestionsBox').style.display = 'none';
      }
    }

    nextRound();
  </script>
</body>
</html>
